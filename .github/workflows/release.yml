name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Select newest Xcode on runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Core tests
        run: swift test --package-path SafeClipCore

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (unsigned Release)
        run: |
          set -o pipefail
          xcodebuild -project SafeClip.xcodeproj -scheme SafeClip \
            -configuration Release \
            -derivedDataPath dist \
            build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          if grep -E "^.* warning: " build.log | grep -v "appintentsmetadataprocessor"; then
            echo "::error::warnings found — zero-warnings policy"; exit 1
          fi

      - name: Package zip
        run: |
          ditto -c -k --keepParent \
            "dist/Build/Products/Release/SafeClip.app" \
            "SafeClip-${RELEASE_VERSION}-unsigned.zip"
          echo "RELEASE_ZIP=SafeClip-${RELEASE_VERSION}-unsigned.zip" >> "$GITHUB_ENV"
          echo "CHECKSUM=$(shasum -a 256 "SafeClip-${RELEASE_VERSION}-unsigned.zip" | awk '{print $1}')" \
            >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          cat > release-notes.md << EOF
          ## SafeClip ${RELEASE_VERSION}

          ### ⚠️ Unsigned build — Gatekeeper will warn on first launch

          This release is built by CI and has not yet been notarised by Apple
          (notarisation requires a paid Developer ID certificate — coming later).
          macOS will block the app on first open. To bypass:

          **Option A — right-click:**
          1. Download and unzip \`${RELEASE_ZIP}\`
          2. Right-click \`SafeClip.app\` → **Open**
          3. Click **Open** in the warning dialog
          4. SafeClip launches normally from then on

          **Option B — Terminal (one command):**
          \`\`\`sh
          xattr -d com.apple.quarantine /path/to/SafeClip.app
          \`\`\`
          Then double-click to open normally.

          ### SHA-256 checksum
          \`\`\`
          ${CHECKSUM}  ${RELEASE_ZIP}
          \`\`\`
          Verify with: \`shasum -a 256 ${RELEASE_ZIP}\`

          ### Build from source (highest trust)
          See the [README](https://github.com/Mudit01100001/safeclip#install) — only Xcode 16+ required.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            --title "SafeClip ${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            "${RELEASE_ZIP}"
